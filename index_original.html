<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso Administrador</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1A6PFi2lpp_VNhnmtTYGkYXyjMZ1p8LhA" type="image/png">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    body { background-color: #111111; color: #e5e2e1; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#111111] text-[#e5e2e1] min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-[#181818] border border-[#292929] rounded-2xl p-6 shadow-xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">Portal de Gestión</h1>
      <p class="text-xs text-[#9aa0a6] mt-1">Acceso restringido — autenticación server-side requerida</p>
    </div>

    <div id="alerta" class="hidden mb-4 p-3 rounded-lg text-sm" role="alert" aria-live="polite">
      <p id="alerta-text"></p>
    </div>

    <div class="space-y-4 mb-6">
      <button id="btn-google" class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-[#222222] border border-[#333333] rounded-xl text-white font-semibold text-sm" disabled aria-disabled="true" title="Autenticación vía Google disponible desde el backend">
        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
        <span id="txt-google">Iniciar sesión con Google (backend)</span>
      </button>
    </div>

    <div class="relative flex items-center justify-center my-4">
      <div class="border-t border-[#292929] w-full"></div>
      <span class="absolute bg-[#181818] px-3 text-xs text-[#7c848a] uppercase tracking-wider">o clave de respaldo</span>
    </div>

    <form id="form-key" class="space-y-3">
      <label class="block text-xs font-semibold text-[#c0c7cf] uppercase tracking-wider">Clave Maestra</label>
      <div class="relative">
        <input id="input-key" type="password" autocomplete="current-password" placeholder="Introduce la clave de respaldo" class="w-full bg-[#111111] border border-[#2f2f2f] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-[#38bdf8]" required>
        <button type="button" id="btn-toggle" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8b9199]" aria-label="Mostrar u ocultar clave">
          <span id="eye" class="material-symbols-outlined">visibility</span>
        </button>
      </div>

      <button id="btn-submit" type="submit" class="w-full py-3 rounded-xl bg-[#005580] hover:bg-[#006ca3] text-white font-bold">Ingresar</button>
    </form>

    <p class="text-[11px] text-[#8b9199] mt-4 text-center">Si no funciona, verifica que el backend esté desplegado y que los endpoints /api/verify-key y /api/session existan en la misma origin.</p>
  </main>

  <script>
    const alerta = document.getElementById('alerta');
    const alertaText = document.getElementById('alerta-text');
    const form = document.getElementById('form-key');
    const inputKey = document.getElementById('input-key');
    const btnSubmit = document.getElementById('btn-submit');
    const btnGoogle = document.getElementById('btn-google');
    const txtGoogle = document.getElementById('txt-google');
    const eye = document.getElementById('eye');
    const btnToggle = document.getElementById('btn-toggle');

    function showAlert(message, isError = true) {
      if (!alerta || !alertaText) return;
      alertaText.textContent = message;
      alerta.className = isError
        ? 'mb-4 p-3 rounded-lg text-sm bg-red-950/30 border border-red-600/30 text-red-200'
        : 'mb-4 p-3 rounded-lg text-sm bg-emerald-950/20 border border-emerald-500/30 text-emerald-200';
      alerta.classList.remove('hidden');
    }

    function hideAlert() {
      if (!alerta) return;
      alerta.classList.add('hidden');
    }

    (async function checkSession() {
      try {
        const res = await fetch('/api/session', { method: 'GET', credentials: 'include' });
        if (res.ok) {
          window.location.replace(window.location.origin + window.location.pathname.replace(/[^\/]*$/, '') + 'panel.html');
        }
      } catch (e) {
        console.warn('session check:', e);
      }
    })();

    btnToggle.addEventListener('click', () => {
      if (!inputKey) return;
      if (inputKey.type === 'password') {
        inputKey.type = 'text';
        eye.textContent = 'visibility_off';
      } else {
        inputKey.type = 'password';
        eye.textContent = 'visibility';
      }
    });

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      hideAlert();
      const key = inputKey.value.trim();
      if (!key) {
        showAlert('Ingresá la clave de respaldo.', true);
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verificando...';

      try {
        const resp = await fetch('/api/verify-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ key })
        });

        if (resp.ok) {
          showAlert('Autenticación exitosa. Redirigiendo...', false);
          setTimeout(() => {
            window.location.replace(window.location.origin + window.location.pathname.replace(/[^\/]*$/, '') + 'panel.html');
          }, 500);
          return;
        }

        const j = await resp.json().catch(() => null);
        const msg = (j && (j.message || j.error)) ? (j.message || j.error) : 'Clave incorrecta o no autorizada.';
        showAlert(msg, true);
        inputKey.value = '';
        inputKey.focus();
      } catch (err) {
        console.error('verify-key error', err);
        showAlert('Fallo de conexión con el servidor. Reintentá más tarde.', true);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Ingresar';
      }
    });

    btnGoogle.addEventListener('click', (e) => {
      e.preventDefault();
      showAlert('La autenticación con proveedor (Google) debe estar iniciada desde el backend. Si querés, implemento /api/start-oauth.', true);
    });
  </script>
</body>
</html>
