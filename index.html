<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso Administrador</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1A6PFi2lpp_VNhnmtTYGkYXyjMZ1p8LhA" type="image/png">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    body { background-color: #111111; color: #e5e2e1; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#111111] text-[#e5e2e1] min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-[#181818] border border-[#292929] rounded-2xl p-6 shadow-xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">Portal de Gestión</h1>

      <p class="text-xs text-[#9aa0a6] mt-1">Acceso restringido — autenticación segura</p>

    </div>

    <div id="alerta" class="hidden mb-4 p-3 rounded-lg text-sm" role="alert" aria-live="polite">
      <p id="alerta-text"></p>
    </div>


    <form id="form-key" class="space-y-3">
      <label class="block text-xs font-semibold text-[#c0c7cf] uppercase tracking-wider">Clave Maestra</label>
      <div class="relative">
        <input id="input-key" type="password" autocomplete="current-password" placeholder="Introduce la clave de respaldo" class="w-full bg-[#111111] border border-[#2f2f2f] rounded-xl px-4 py-3 text-[#e5e2e1] placeholder-[#555555] focus:border-[#38bdf8] focus:ring-1 focus:ring-[#38bdf8] transition duration-150">

        <button type="button" id="btn-toggle" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8b9199]" aria-label="Mostrar u ocultar clave">
          <span id="eye" class="material-symbols-outlined">visibility</span>
        </button>
      </div>


      <button id="btn-submit" type="submit" class="w-full py-3 rounded-xl bg-[#005580] hover:bg-[#006ca3] text-white font-bold transition duration-150">Ingresar</button>
    </form>

    <p class="text-[11px] text-[#8b9199] mt-4 text-center">La sesión se valida de forma segura en el servidor. Las cookies están protegidas con HttpOnly.</p>

  </main>

  <script>
    const alerta = document.getElementById('alerta');
    const alertaText = document.getElementById('alerta-text');
    const form = document.getElementById('form-key');
    const inputKey = document.getElementById('input-key');
    const btnSubmit = document.getElementById('btn-submit');

    
    const eye = document.getElementById('eye');
    const btnToggle = document.getElementById('btn-toggle');

    function showAlert(message, isError = true) {
      if (!alerta || !alertaText) return;
      alertaText.textContent = message;
      alerta.className = isError
        ? 'mb-4 p-3 rounded-lg text-sm bg-red-950/30 border border-red-600/30 text-red-200'
        : 'mb-4 p-3 rounded-lg text-sm bg-emerald-950/20 border border-emerald-500/30 text-emerald-200';
      alerta.classList.remove('hidden');
    }

    function hideAlert() {
      if (!alerta) return;
      alerta.classList.add('hidden');
    }

    (async function checkSession() {
      try {

        const res = await fetch('/api/session', {
          method: 'GET',
          credentials: 'include'
        });

        if (res.ok) {
          window.location.replace('./panel.html');
        }
      } catch (e) {
        console.warn('session check failed:', e);
      }
    })();

    btnToggle.addEventListener('click', () => {
      if (!inputKey) return;
      if (inputKey.type === 'password') {
        inputKey.type = 'text';
        eye.textContent = 'visibility_off';
      } else {
        inputKey.type = 'password';
        eye.textContent = 'visibility';
      }
    });

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      hideAlert();

      const key = inputKey.value.trim();

      if (!key) {
        showAlert('Ingresá la clave de respaldo.', true);
        return;
      }


      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verificando...';

      try {
        const resp = await fetch('/api/verify-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',

          body: JSON.stringify({ key, email: 'admin@local' })
        });

        if (resp.ok) {
          showAlert('Autenticación exitosa. Redirigiendo...', false);
          setTimeout(() => {
            window.location.replace('./panel.html');
          }, 500);
          return;
        }


        const j = await resp.json().catch(() => null);
        const msg = (j && (j.message || j.error)) ? (j.message || j.error) : 'Clave incorrecta o no autorizada.';
        showAlert(msg, true);
        inputKey.value = '';
        inputKey.focus();


      } catch (err) {
        console.error('verify-key error', err);
        showAlert('Fallo de conexión con el servidor. Reintentá más tarde.', true);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
